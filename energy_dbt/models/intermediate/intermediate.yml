version: 2

models:
  - name: int_power_price_daily
    description: Daily aggregation of five-minute NEM power prices.
    columns:
      - name: market_date
        tests: [not_null]
      - name: state_code
        tests: [not_null]
      - name: interval_count
        tests: [not_null]
      - name: avg_power_price_aud_mwh
        tests: [not_null]

  - name: int_gas_price_daily
    description: Daily comparable STTM and DWGM gas prices.
    columns:
      - name: gas_date
        tests: [not_null]
      - name: state_code
        tests: [not_null]
      - name: gas_price_aud_gj
        tests: [not_null]
